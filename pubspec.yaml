name: theuniversedecides
description: "A mystical Flutter decision app powered by Random.org with local fallback randomness."

publish_to: 'none'

version: 2.6.2+100170

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.4
  # Browser DOM interop for the web-only dice renderer host (see
  # lib/dice/dice_renderer_web.dart). Never imported by mobile builds.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/dice/
    - assets/dice/libs/
    - assets/sounds/
