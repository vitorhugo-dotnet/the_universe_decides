name: Deploy Web

# Publishes the Flutter Web build to GitHub Pages. Kept separate from the
# `CI/CD` workflow on purpose: the Android release pipeline owns versioning,
# tagging, Play and F-Droid, and must not gain a browser-only dependency.
#
# Requires "Settings -> Pages -> Build and deployment -> Source" to be set to
# "GitHub Actions" once, in the repository settings.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-web.yml"
      - "lib/**"
      - "test/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
      - "l10n.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest commit is worth publishing, so supersede in-flight deploys.
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `actions/configure-pages` reads the repository's Pages settings.
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve base href
        id: base
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          # The public address is `https://coin.hugojava.dev/` at the hostname
          # root, but Pages only serves it there once the custom domain is
          # registered in the repository settings; until then it serves the
          # same build from the project path `/the_universe_decides/`. Either
          # value is hardcoded wrong on the other host, and the failure is
          # total rather than partial: `flutter_bootstrap.js` 404s, the engine
          # never boots, no `flutter-first-frame` event fires, and the static
          # placeholder in `web/index.html` stays on screen forever. Reading
          # the live Pages settings keeps the base href correct wherever the
          # site is actually published, so the pending-registration window
          # stays usable and going live needs no code change.
          HREF="$BASE_PATH"

          if [[ -z "$HREF" ]]; then
            echo "actions/configure-pages returned no base path." >&2
            exit 1
          fi

          # Flutter requires a leading and a trailing slash; the action reports
          # the path without the trailing one.
          [[ "$HREF" == /* ]] || HREF="/$HREF"
          [[ "$HREF" == */ ]] || HREF="$HREF/"

          echo "Publishing with base href $HREF"
          echo "href=$HREF" >> "$GITHUB_OUTPUT"

      - name: Resolve Flutter version
        id: flutter
        shell: bash
        run: |
          # `.github/workflows/build-signed-apk.yml` is the single source of the
          # project's Flutter version; F-Droid reads the same declaration when
          # it builds from source. Reading it here keeps web and Android on one
          # toolchain instead of two values that silently drift apart.
          VERSION=$(sed -nE 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p' \
            .github/workflows/build-signed-apk.yml | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "Unable to read FLUTTER_VERSION from build-signed-apk.yml." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web
        # The base href comes from the live Pages configuration, so assets and
        # client-side routes resolve on the project path and on the custom
        # domain alike.
        run: |
          flutter build web \
            --release \
            --base-href "${{ steps.base.outputs.href }}"

      - name: Verify web artifact
        shell: bash
        env:
          BASE_HREF: ${{ steps.base.outputs.href }}
        run: |
          test -f build/web/index.html
          cp build/web/index.html build/web/404.html
          test -f build/web/404.html
          grep -Fq "<base href=\"$BASE_HREF\">" build/web/index.html
          cmp --silent build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    # A failed analyze, test or build fails `build`, and this job never runs,
    # so a broken commit can never replace a working published site.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
