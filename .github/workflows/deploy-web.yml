name: Deploy Web to Cloudflare Workers

# Publishes the Flutter Web build to Cloudflare Workers Static Assets.
# CI/CD calls this workflow only after analyze and tests have passed. The Android
# release chain does not depend on this workflow.

on:
  workflow_call:
    inputs:
      validated:
        description: >-
          Set by a caller that already ran `flutter analyze` and `flutter test`
          against this exact commit, so this workflow does not run them twice.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Flutter version
        id: flutter
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p' \
            .github/workflows/build-signed-apk.yml | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "Unable to read FLUTTER_VERSION from build-signed-apk.yml." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        if: ${{ !inputs.validated }}
        run: flutter analyze

      - name: Test
        if: ${{ !inputs.validated }}
        run: flutter test

      - name: Build web
        run: |
          flutter build web \
            --release \
            --wasm \
            --base-href /

      - name: Verify web artifact
        shell: bash
        run: |
          test -f build/web/index.html
          grep -Fq '<base href="/">' build/web/index.html

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
