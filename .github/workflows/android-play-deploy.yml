name: Android Play Deploy

on:
  workflow_call:
    inputs:
      version_name:
        description: Flutter versionName generated by CI/CD
        required: true
        type: string
      version_code:
        description: Android versionCode generated by CI/CD
        required: true
        type: string
      source_ref:
        description: Commit containing the persisted release version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version_name:
        description: Flutter versionName to deploy
        required: true
        type: string
      version_code:
        description: Android versionCode to deploy
        required: true
        type: string
      source_ref:
        description: Branch, tag, or commit containing the release version
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: android-play-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.1"
  ANDROID_PACKAGE_NAME: "com.hugo.theuniversedecides"
  PLAY_TRACK: "beta"

jobs:
  deploy-google-play:
    name: Deploy signed AAB to Google Play open testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Validate persisted release version
        shell: bash
        run: |
          EXPECTED_VERSION="${{ inputs.version_name }}+${{ inputs.version_code }}"
          ACTUAL_VERSION=$(sed -nE 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "Expected pubspec version '$EXPECTED_VERSION', found '$ACTUAL_VERSION'." >&2
            exit 1
          fi

      - name: Prepare localized Google Play changelogs
        shell: bash
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          source_path = Path("CHANGELOG.xml")
          metadata_path = Path(os.environ["RUNNER_TEMP"]) / "play-metadata"
          version_code = os.environ["PLAY_VERSION_CODE"].strip()
          expected_locales = (
              "en-US",
              "pt-BR",
              "es-ES",
              "de",
              "fr-FR",
              "hi",
              "it",
              "tr",
              "uk",
          )

          if not version_code.isdigit():
              raise SystemExit(f"Invalid Android versionCode: {version_code!r}")

          source = source_path.read_text(encoding="utf-8")
          block_pattern = re.compile(
              r"<([A-Za-z0-9-]+)>\s*(.*?)\s*</\1>",
              re.DOTALL,
          )
          blocks = block_pattern.findall(source)
          locales = tuple(locale for locale, _ in blocks)

          if locales != expected_locales:
              raise SystemExit(
                  "CHANGELOG.xml locales must appear exactly once in this order: "
                  + ", ".join(expected_locales)
                  + f". Found: {', '.join(locales) or 'none'}."
              )

          if block_pattern.sub("", source).strip():
              raise SystemExit(
                  "CHANGELOG.xml contains content outside the supported locale blocks."
              )

          shutil.rmtree(metadata_path, ignore_errors=True)

          for locale, raw_notes in blocks:
              notes = raw_notes.strip()
              if not notes:
                  raise SystemExit(f"CHANGELOG.xml locale {locale} is empty.")
              if len(notes) > 500:
                  raise SystemExit(
                      f"CHANGELOG.xml locale {locale} exceeds 500 characters "
                      f"({len(notes)})."
                  )

              invalid_lines = [
                  line for line in notes.splitlines() if line and not line.startswith("- ")
              ]
              if invalid_lines:
                  raise SystemExit(
                      f"CHANGELOG.xml locale {locale} must contain only '- ' bullets."
                  )

              output_path = (
                  metadata_path / locale / "changelogs" / f"{version_code}.txt"
              )
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(f"{notes}\n", encoding="utf-8")
              print(f"Prepared {output_path}")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate deployment secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!secret_name}" ]; then
              echo "Missing required repository secret: ${secret_name}" >&2
              exit 1
            fi
          done

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Create Google Play service account file
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json

      - name: Build signed Android App Bundle
        run: |
          echo "Using Flutter version: ${{ inputs.version_name }}+${{ inputs.version_code }}"
          flutter build appbundle \
            --release \
            --flavor play \
            --build-name "${{ inputs.version_name }}" \
            --build-number "${{ inputs.version_code }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-universe-decides-play-beta-${{ inputs.version_code }}-aab
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error

      - name: Install Fastlane
        run: |
          gem install fastlane --user-install --no-document
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Upload AAB and changelogs to Google Play open testing
        run: |
          fastlane supply \
            --aab build/app/outputs/bundle/playRelease/app-play-release.aab \
            --track "$PLAY_TRACK" \
            --release_status completed \
            --json_key play-service-account.json \
            --package_name "$ANDROID_PACKAGE_NAME" \
            --metadata_path "$RUNNER_TEMP/play-metadata" \
            --skip_upload_metadata true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --skip_upload_changelogs false \
            --rescue_changes_not_sent_for_review true
