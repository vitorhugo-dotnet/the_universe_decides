name: Trigger Play Deploy After CI/CD

on:
  workflow_run:
    workflows: ["CI/CD"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  trigger-play-deploy:
    name: Trigger Android Play Deploy
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    steps:
      - name: Trigger Android Play Deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          VERSION_CODE_OFFSET: "100000"
        run: |
          VERSION_CODE=$((VERSION_CODE_OFFSET + SOURCE_RUN_NUMBER))

          echo "Deploying Android versionCode: $VERSION_CODE"

          gh workflow run android-play-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f version_code="$VERSION_CODE"
