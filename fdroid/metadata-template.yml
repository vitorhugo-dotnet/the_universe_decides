Categories:
  - System
License: MIT
AuthorName: Vitor Hugo
SourceCode: https://github.com/vitorhugo-dotnet/the_universe_decides
IssueTracker: https://github.com/vitorhugo-dotnet/the_universe_decides/issues

AutoName: The Universe Decides
Summary: Make decisions with real randomness and a local fallback
Description: |-
  The Universe Decides helps indecisive people leave small choices to chance.

  It can flip coins, roll dice, draw cards, choose an item from a custom list,
  and keep a history of recent results. Random.org is used when available, with
  local randomness as an offline fallback.

  The F-Droid flavor excludes Google Play Games Services. The hidden minigame
  remains playable offline, without achievements or online leaderboards.

AntiFeatures:
  NonFreeNet:
    en-US: Random.org is used when available; local randomness remains available as a fallback.

RepoType: git
Repo: https://github.com/vitorhugo-dotnet/the_universe_decides.git

Builds:
  - versionName: 2.5.0
    versionCode: 5
    commit: REPLACE_WITH_MERGED_COMMIT_OR_RELEASE_TAG
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@3.38.1
    rm:
      - android/app/src/play
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i '/playImplementation/d' android/app/build.gradle.kts
      - git -C $$flutter$$ checkout -f 3.38.1
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --build-number $$VERCODE$$

CurrentVersion: 2.5.0
CurrentVersionCode: 5
