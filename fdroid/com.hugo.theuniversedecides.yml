AntiFeatures:
  NonFreeNet:
    en-US: Random.org is used when available; local randomness remains available as a fallback.

Categories:
  - System

License: MIT
AuthorName: Vitor Hugo
AuthorWebSite: https://hugodotnet.dev
SourceCode: https://github.com/vitorhugo-dotnet/the_universe_decides
IssueTracker: https://github.com/vitorhugo-dotnet/the_universe_decides/issues

AutoName: The Universe Decides

RepoType: git
Repo: https://github.com/vitorhugo-dotnet/the_universe_decides.git

Builds:
  - versionName: 2.5.0
    versionCode: 100117
    commit: 4dd0483f80e217ada415488c7b9cd04ac2cca949
    output: build/app/outputs/flutter-apk/app-fdroid-release.apk
    srclibs:
      - flutter@stable
    rm:
      - android/app/src/play
      - ios
      - linux
      - macos
      - web
      - windows
    prebuild:
      - sed -i '/playImplementation/d' android/app/build.gradle.kts
      - flutterVersion=$(sed -n -E 's/^[[:space:]]*FLUTTER_VERSION:[[:space:]]*"([^"]+)".*$/\1/p' .github/workflows/build-signed-apk.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f "$flutterVersion"
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --flavor fdroid --build-number $$VERCODE$$

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$
UpdateCheckData: '|\+(\d+)$||^v([^+]+)\+\d+$'
CurrentVersion: 2.5.0
CurrentVersionCode: 100117